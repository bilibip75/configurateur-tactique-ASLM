services:
  - type: web
    name: configurateur-tactique-aslm
    runtime: static
    buildCommand: echo "PWA ASLM prête à publier"
    staticPublishPath: .
    headers:
      - path: /*
        name: X-Content-Type-Options
        value: nosniff
      - path: /*
        name: X-Frame-Options
        value: SAMEORIGIN
      - path: /*
        name: Referrer-Policy
        value: no-referrer
      - path: /*
        name: Permissions-Policy
        value: "geolocation=(), microphone=(), camera=(self)"
      - path: /sw.js
        name: Cache-Control
        value: "no-cache, no-store, must-revalidate"
      - path: /manifest.webmanifest
        name: Cache-Control
        value: "no-cache"
